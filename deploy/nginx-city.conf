# simm.is/city/: the static explorer, released independently of the website.
# Goes inside the `server_name simm.is` block that serves HTTPS, before
# `location /`. `^~` keeps the block's `\.(css|js|…)$` rule from answering
# /city/js/main.js out of the website's release folder.
location = /city { return 301 /city/; }
location ^~ /city/ {
    alias /var/www/city-releases/current/;
    index index.html;
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex";
    gzip_static on;
}
